
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policies | Popoye Insurance</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="images/logo.png" alt="Logo"><span>Popoye Insurance</span></div>
    <nav>
      <a href="dashboard.html">Dashboard</a><a href="customers.html">Customers</a>
      <a class="active" href="policies.html">Policies</a><a href="payments.html">Payments</a>
      <a href="transactions.html">Transactions</a><a href="reports.html">Reports</a>
      <a href="automation.html">Automation</a><a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">Two-Wheeler Insurance</div>
  </aside>
  <main class="main">
    <header class="topbar"><div><h1>Policies</h1><p>Track policy details and renewal dates.</p></div></header>
    <section class="stats">
      <article class="stat-card"><p>Total Policies</p><h2 id="policyCount">0</h2></article>
      <article class="stat-card"><p>Active Policies</p><h2 id="activePolicyCount">0</h2></article>
      <article class="stat-card"><p>Expired Policies</p><h2 id="expiredPolicyCount">0</h2></article>
    </section>
    <section class="panel">
      <div class="section-heading"><h2>Policy Register</h2><input id="policySearch" placeholder="Search policy or vehicle..."></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Policy Number</th><th>Customer</th><th>Vehicle</th><th>Premium</th><th>Expiry Date</th><th>Status</th></tr></thead>
          <tbody id="policiesTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
