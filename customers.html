
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers | Popoye Insurance</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="images/logo.png" alt="Logo"><span>Popoye Insurance</span></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="customers.html">Customers</a>
      <a href="policies.html">Policies</a>
      <a href="payments.html">Payments</a>
      <a href="transactions.html">Transactions</a>
      <a href="reports.html">Reports</a>
      <a href="automation.html">Automation</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">Two-Wheeler Insurance</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>Customers</h1><p>Manage your customer records.</p></div>
      <button class="btn" onclick="showCustomerForm()">+ Add Customer</button>
    </header>

    <section class="panel" id="customerFormPanel" hidden>
      <h2>Add Customer</h2>
      <form id="customerForm">
        <label>Customer Name<input name="name" required></label>
        <label>Phone Number<input name="phone" type="tel" required></label>
        <label>Vehicle Number<input name="vehicle" required></label>
        <label>Premium Amount (₹)<input name="premium" type="number" min="1" required></label>
        <label>Policy Expiry Date<input name="expiry" type="date" required></label>
        <button class="btn" type="submit">Save Customer</button>
        <button class="btn secondary" type="button" onclick="showCustomerForm(false)">Cancel</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Customer Directory</h2>
        <input id="customerSearch" placeholder="Search customers...">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Premium</th><th>Expiry</th></tr></thead>
          <tbody id="customersTable"></tbody>
        </table>
      </div>
    </section>
    <p class="notice">Demo data is stored in this browser only.</p>
  </main>
</body>
</html>
